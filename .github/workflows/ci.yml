name: Portão de conclusão

# Traduz em automação o Princípio V da constituição: nenhuma alteração é
# considerada pronta sem lint, typecheck, testes unitários, testes de
# integração e build de produção passando ao mesmo tempo — mais o teste de
# regressão do Princípio X, que bloqueia qualquer mudança de regra de domínio
# que altere os números do arquivo de referência.

on:
  push:
    branches: [main, '001-*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://painel:painel_ci@localhost:5432/painel_leitura_ci?schema=public
  SESSION_SECRET: segredo-de-integracao-continua-com-mais-de-32-caracteres
  IMPORT_STORAGE_DIR: ./storage/imports-ci
  IMPORT_MAX_FILE_SIZE_MB: '20'
  IMPORT_FILE_RETENTION_DAYS: '90'

jobs:
  portao:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: painel
          POSTGRES_PASSWORD: painel_ci
          POSTGRES_DB: painel_leitura_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U painel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Preparar o banco
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários e de integração
        run: npm test

      # Portão do Princípio X. Falhou aqui, os números do arquivo de
      # referência mudaram — e isso nunca é acidente aceitável.
      - name: Teste de regressão do arquivo de referência
        run: npm run test:regression

      - name: Build de produção
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: portao
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: painel
          POSTGRES_PASSWORD: painel_ci
          POSTGRES_DB: painel_leitura_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U painel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Preparar o banco
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npm run db:seed

      - run: npm run build

      - name: Testes de ponta a ponta
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
